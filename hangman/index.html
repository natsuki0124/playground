<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>英文單字倒吊人遊戲</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>Hangman Challenge</h1>
        <div class="visuals">
            <canvas id="hangmanCanvas" width="200" height="250"></canvas>
            <div id="wordDisplay" class="word-display"></div>
        </div>
        <p id="message"></p>
        <div id="keyboard" class="keyboard"></div>
        <button id="resetBtn">重新開始</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
